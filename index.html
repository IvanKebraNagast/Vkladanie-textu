<!doctype html>
<html lang="sk" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Text na Obrázok Pro</title>
  
  <!-- ✅ IKONA (IMG_1405.png) - ZACHOVANÁ -->
  <link rel="apple-touch-icon" sizes="180x180" href="./IMG_1405.png">
  <link rel="icon" type="image/png" href="./IMG_1405.png">
  <link rel="shortcut icon" href="./IMG_1405.png">

  <!-- iOS nastavenia -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TextApp">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;700&family=Lora:ital,wght@0,600;1,600&family=Oswald:wght@500&display=swap" rel="stylesheet">
  
  <style>
    body {
      touch-action: manipulation;
      overscroll-behavior: none;
      font-family: 'Inter', sans-serif;
      background-color: #111827;
    }
    
    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    canvas {
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      max-width: 98%;
      max-height: 98%;
      object-fit: contain;
    }
    
    .controls-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 16px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
      z-index: 50;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 75vh;
      overflow-y: auto;
    }

    .controls-panel.collapsed {
        transform: translateY(calc(100% - 60px));
    }

    .toggle-handle {
        width: 50px;
        height: 6px;
        background-color: #e5e7eb;
        border-radius: 10px;
        margin: 0 auto 15px auto;
        cursor: pointer;
    }

    .save-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.98);
        z-index: 100;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    
    .save-modal img {
        max-width: 100%;
        max-height: 70vh;
        border-radius: 12px;
        margin-bottom: 24px;
        box-shadow: 0 0 30px rgba(255,255,255,0.1);
    }

    input[type="color"] {
        -webkit-appearance: none;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid #e5e7eb; border-radius: 50%; }

    .bg-preset-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #e5e7eb;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .bg-preset-btn:hover {
      transform: scale(1.1);
      border-color: #4f46e5;
    }
  </style>
 </head>
 <body class="h-full flex flex-col">

  <div class="canvas-wrapper flex-1">
      <canvas id="canvas"></canvas>
      <div id="placeholder" class="absolute text-white text-center pointer-events-none p-6 hidden">
          <div class="bg-gray-800/50 backdrop-blur-md p-8 rounded-3xl border border-white/10">
              <svg class="w-16 h-16 mx-auto mb-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <h2 class="text-2xl font-bold mb-1">Vytvorte vizuál</h2>
              <p class="text-gray-400">Vyberte predlohu alebo nahrajte fotku</p>
          </div>
      </div>
  </div>

  <div id="saveModal" class="save-modal">
      <div class="text-center mb-6">
          <h3 class="text-white text-2xl font-bold mb-2">Pripravené!</h3>
          <p class="text-gray-400 text-sm">Podržte prst na obrázku a uložte si ho.</p>
      </div>
      <img id="resultImage" alt="Výsledok">
      <button onclick="closeModal()" class="px-10 py-4 bg-white text-black font-black rounded-full shadow-xl active:scale-95 transition-transform uppercase tracking-wider">Zavrieť</button>
  </div>

  <div class="controls-panel" id="controlsPanel">
      <div class="toggle-handle" id="togglePanel"></div>
      
      <div class="max-w-md mx-auto space-y-4 pb-8">
          <!-- Pozadia a fotky -->
          <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
              <h3 class="text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">Pozadie / Predloha</h3>
              <div class="flex items-center gap-3 overflow-x-auto pb-1">
                  <!-- Predvoľby pozadí -->
                  <button class="bg-preset-btn shrink-0" style="background: #ffffff;" onclick="setPresetBackground('solid', '#ffffff')" title="Čistá biela"></button>
                  <button class="bg-preset-btn shrink-0" style="background: #fdfbf7;" onclick="setPresetBackground('solid', '#fdfbf7')" title="Papier / Krémová"></button>
                  <button class="bg-preset-btn shrink-0" style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);" onclick="setPresetBackground('gradient', '#f5f7fa', '#c3cfe2')" title="Jemná modrá"></button>
                  <button class="bg-preset-btn shrink-0" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);" onclick="setPresetBackground('gradient', '#ff9a9e', '#fecfef')" title="Ružový sen"></button>
                  <button class="bg-preset-btn shrink-0" style="background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);" onclick="setPresetBackground('gradient', '#a1c4fd', '#c2e9fb')" title="Nebeská modrá"></button>
                  <button class="bg-preset-btn shrink-0" style="background: #111827;" onclick="setPresetBackground('solid', '#111827')" title="Tmavá elegancia"></button>
                  
                  <!-- Tlačidlo pre vlastnú fotku -->
                  <label class="shrink-0 px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow active:scale-95 transition cursor-pointer flex items-center gap-1">
                      <span>📷</span> Vlastná fotka
                      <input type="file" id="imageUpload" accept="image/*" class="hidden">
                  </label>
              </div>
          </div>

          <div class="flex gap-3">
              <button id="shareBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl font-bold shadow-lg active:scale-95 transition flex items-center justify-center gap-2 text-sm">
                  <span>💾</span> Hotovo & Uložiť
              </button>
          </div>

          <div class="grid grid-cols-2 gap-3">
              <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                  <h3 class="text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">Štýl karty</h3>
                  <div class="flex gap-1">
                      <button class="flex-1 py-2 rounded-lg bg-white border border-gray-200 text-xs font-bold shadow-sm" onclick="setTheme('light')">Svetlá</button>
                      <button class="flex-1 py-2 rounded-lg bg-gray-900 text-white text-xs font-bold shadow-sm" onclick="setTheme('dark')">Tmavá</button>
                      <button class="flex-1 py-2 rounded-lg bg-red-100 text-red-600 text-xs font-bold shadow-sm" onclick="setTheme('none')">Bez</button>
                  </div>
              </div>
              <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                  <h3 class="text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">Písmo a Farba</h3>
                  <div class="flex items-center gap-2">
                      <select id="fontFamilySelect" class="flex-1 p-2 text-xs font-bold border-none bg-transparent focus:ring-0 outline-none">
                          <option value="'Inter', sans-serif">Moderné</option>
                          <option value="'Lora', serif">Pätkové</option>
                          <option value="'Caveat', cursive">Písané</option>
                          <option value="'Oswald', sans-serif">Nadpisové</option>
                      </select>
                      <input type="color" id="fontColorInput" value="#1f2937">
                  </div>
              </div>
          </div>

          <!-- Ovládanie veľkosti písma (Target Size) -->
          <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
              <div class="flex justify-between items-center mb-1">
                  <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Veľkosť písma (Požadovaná)</h3>
                  <span id="fontSizeVal" class="text-xs font-bold text-indigo-600">32px</span>
              </div>
              <div class="flex items-center gap-2">
                  <input type="range" id="fontSizeInput" min="12" max="72" value="32" class="flex-1 accent-indigo-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                  <span id="activeSizeIndicator" class="text-[10px] font-bold text-gray-400 bg-gray-200 px-2 py-1 rounded">Aktuálna: 32px</span>
              </div>
          </div>

          <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
              <div class="flex justify-between items-center mb-1">
                  <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Priehľadnosť pozadia</h3>
                  <span id="opacityVal" class="text-xs font-bold text-indigo-600">70%</span>
              </div>
              <input type="range" id="opacityInput" min="0" max="100" value="70" class="w-full accent-indigo-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
          </div>

          <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
              <h3 class="text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">Obsah textu</h3>
              <textarea id="textInput" rows="5" class="w-full p-3 text-base border-none rounded-xl bg-white shadow-inner resize-none focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Sem vložte text..."></textarea>
          </div>
      </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const imageUpload = document.getElementById('imageUpload');
    const shareBtn = document.getElementById('shareBtn');
    const textInput = document.getElementById('textInput');
    const fontSizeInput = document.getElementById('fontSizeInput');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const activeSizeIndicator = document.getElementById('activeSizeIndicator');
    const opacityInput = document.getElementById('opacityInput');
    const opacityVal = document.getElementById('opacityVal');
    const fontFamilySelect = document.getElementById('fontFamilySelect');
    const fontColorInput = document.getElementById('fontColorInput');
    const placeholder = document.getElementById('placeholder');
    const controlsPanel = document.getElementById('controlsPanel');
    const togglePanel = document.getElementById('togglePanel');
    const saveModal = document.getElementById('saveModal');
    const resultImage = document.getElementById('resultImage');

    textInput.value = "KOLENÁ – BOLESTI A OPUCHY\n\n1. BOLESTI KOLENA\n\nRecept č. 1 – Med a klinčeky: Večer pred spaním potrieť koleno medom a posypať pomletými klinčekmi. Priložiť list lopúcha, obviazať a nechať pôsobiť celú noc. Opakovať 4 noci.\n\nRecept č. 2 – Med, pálenka a ryža: Večer koleno 4-krát potrieť medom, priložiť obklad z pálenky a navrch položiť uvarenú ryžu. Opakovať, kým bolesť neustúpi.";

    // Pozadie: buď nahratá fotka (img) alebo farebná predloha (presetBg)
    let img = null;
    let presetBg = {
        type: 'solid',
        color1: '#fdfbf7',
        color2: null
    };

    let card = {
        x: 0, y: 0, width: 0, height: 0,
        opacity: 0.7,
        theme: 'light',
        fontFamily: "'Inter', sans-serif",
        fontColor: "#1f2937",
        targetFontSize: 32
    };

    // Inicializácia rozmerov A4 na plátne (pomer 210 x 297, šírka 1200px)
    function initCanvasDimensions() {
        const A4_WIDTH = 1200;
        const A4_HEIGHT = Math.round(1200 * (297 / 210)); // ~1697
        canvas.width = A4_WIDTH;
        canvas.height = A4_HEIGHT;

        card.width = A4_WIDTH * 0.90;
        card.height = A4_HEIGHT * 0.92;
        card.x = (A4_WIDTH - card.width) / 2;
        card.y = (A4_HEIGHT - card.height) / 2;
    }

    function parseStructuredText(rawText) {
        const rawParagraphs = rawText.split('\n');
        let blocks = [];
        rawParagraphs.forEach(p => {
            const trimmed = p.trim();
            if (trimmed === '') {
                blocks.push({ type: 'empty', text: '' });
                return;
            }
            if (trimmed.toUpperCase() === trimmed && trimmed.length > 3 && !trimmed.startsWith('Recept') && !trimmed.startsWith('*')) {
                blocks.push({ type: 'heading', text: trimmed });
            } else if (/^\d+\.\s/.test(trimmed)) {
                blocks.push({ type: 'subheading', text: trimmed });
            } else {
                blocks.push({ type: 'paragraph', text: trimmed });
            }
        });
        return blocks;
    }

    function calculateLayout(context, rawText, maxWidth, maxHeight, targetFontSize, fontFamily) {
        const blocks = parseStructuredText(rawText);
        let lines = [];
        let totalHeight = 0;

        let minFontSize = 6;
        let startFontSize = Math.max(minFontSize, targetFontSize);

        for (let fs = startFontSize; fs >= minFontSize; fs--) {
            fontSize = fs;
            lines = [];
            totalHeight = 0;
            
            const baseLineHeight = fontSize * 1.25;
            const headingGap = Math.max(2, fontSize * 0.3);
            const paragraphGap = Math.max(2, fontSize * 0.25);

            for (let i = 0; i < blocks.length; i++) {
                const block = blocks[i];
                if (block.type === 'empty') {
                    totalHeight += paragraphGap;
                    lines.push({ text: '', isGap: true, gapSize: paragraphGap });
                    continue;
                }

                let isHead = (block.type === 'heading' || block.type === 'subheading');
                let headMultiplier = block.type === 'heading' ? 1.15 : 1.05;
                let blockFont = isHead ? `bold ${fontSize * headMultiplier}px ${fontFamily}` : `${fontSize}px ${fontFamily}`;
                context.font = blockFont;

                if (isHead && i > 0) {
                    totalHeight += headingGap;
                }

                const words = block.text.split(' ');
                let currentLine = words[0];
                let blockLines = [];

                for (let w = 1; w < words.length; w++) {
                    const testLine = currentLine + " " + words[w];
                    if (context.measureText(testLine).width <= maxWidth) {
                        currentLine = testLine;
                    } else {
                        blockLines.push({ text: currentLine, font: blockFont, isHead: isHead });
                        currentLine = words[w];
                    }
                }
                blockLines.push({ text: currentLine, font: blockFont, isHead: isHead });

                for (let bl of blockLines) {
                    const lHeight = bl.isHead ? fontSize * 1.3 : baseLineHeight;
                    totalHeight += lHeight;
                    lines.push({ text: bl.text, font: bl.font, isHead: bl.isHead, height: lHeight });
                }

                totalHeight += paragraphGap;
            }

            if (totalHeight <= maxHeight) {
                return { lines, totalHeight, fontSize, fits: true };
            }
        }

        return { lines, totalHeight, fontSize: minFontSize, fits: false };
    }

    function draw(exportMode = false) {
        // 1. Vykreslenie pozadia (fotka alebo predvolená farba/gradient)
        if (img) {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        } else {
            if (presetBg.type === 'solid') {
                ctx.fillStyle = presetBg.color1;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (presetBg.type === 'gradient') {
                const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grad.addColorStop(0, presetBg.color1);
                grad.addColorStop(1, presetBg.color2);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        let bgColor;
        if (card.theme === 'light') bgColor = `rgba(255, 255, 255, ${card.opacity})`;
        else if (card.theme === 'dark') bgColor = `rgba(0, 0, 0, ${card.opacity})`;
        else bgColor = 'rgba(0,0,0,0)';

        const padding = card.width * 0.06;
        const contentWidth = card.width - (padding * 2);
        const maxContentHeight = card.height - (padding * 2);

        // Výpočet rozloženia textu s prihliadnutím na požadovanú veľkosť
        const layoutResult = calculateLayout(ctx, textInput.value, contentWidth, maxContentHeight, card.targetFontSize, card.fontFamily);
        
        // Aktualizácia indikátora reálnej veľkosti
        activeSizeIndicator.innerText = `Aktuálna: ${layoutResult.fontSize}px`;

        ctx.fillStyle = bgColor;
        if (card.theme !== 'none') {
            const radius = card.width * 0.03;
            ctx.beginPath();
            ctx.roundRect(card.x, card.y, card.width, card.height, radius);
            ctx.fill();
            ctx.strokeStyle = card.theme === 'light' ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else if (!exportMode) {
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.strokeRect(card.x, card.y, card.width, card.height);
            ctx.setLineDash([]);
        }

        const actualTextHeight = layoutResult.totalHeight;
        const startY = card.y + padding + Math.max(5, (maxContentHeight - actualTextHeight) / 2);
        let currentY = startY;

        ctx.fillStyle = card.fontColor;
        ctx.textBaseline = 'alphabetic';

        if (card.theme === 'none' || card.opacity < 0.4) {
            ctx.shadowColor = card.fontColor === '#ffffff' || card.fontColor === '#fff' ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.6)';
            ctx.shadowBlur = Math.max(1, layoutResult.fontSize / 6);
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 1;
        }

        layoutResult.lines.forEach(line => {
            if (line.isGap) {
                currentY += line.gapSize;
                return;
            }
            currentY += line.height;
            ctx.font = line.font;
            ctx.fillText(line.text, card.x + padding, currentY);
        });
        
        ctx.shadowBlur = 0;
        ctx.shadowColor = "transparent";
    }

    // Predvoľby pozadí
    window.setPresetBackground = (type, color1, color2 = null) => {
        img = null; // Zruší nahratú fotku
        presetBg = { type, color1, color2 };
        draw();
    };

    shareBtn.addEventListener('click', () => {
        draw(true);
        resultImage.src = canvas.toDataURL("image/png", 0.9);
        saveModal.style.display = 'flex';
        draw(false);
    });

    window.closeModal = () => { saveModal.style.display = 'none'; }

    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            const tempImg = new Image();
            tempImg.onload = () => {
                // Prispôsobenie plátna pomerom nahranej fotky ak je to potrebné, alebo ponechanie A4
                img = tempImg;
                draw();
            };
            img.src = evt.target.result; // opravené priradenie
            tempImg.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    });

    fontSizeInput.addEventListener('input', (e) => {
        card.targetFontSize = parseInt(e.target.value);
        fontSizeVal.innerText = card.targetFontSize + 'px';
        draw();
    });

    opacityInput.addEventListener('input', (e) => { 
        card.opacity = e.target.value / 100; 
        opacityVal.innerText = e.target.value + '%';
        draw(); 
    });
    
    fontFamilySelect.addEventListener('change', (e) => { card.fontFamily = e.target.value; draw(); });
    fontColorInput.addEventListener('input', (e) => { card.fontColor = e.target.value; draw(); });
    textInput.addEventListener('input', () => draw());
    togglePanel.addEventListener('click', () => { controlsPanel.classList.toggle('collapsed'); });

    window.setTheme = (theme) => {
        card.theme = theme;
        if (theme === 'light') { card.fontColor = '#1f2937'; fontColorInput.value = '#1f2937'; }
        else if (theme === 'dark') { card.fontColor = '#ffffff'; fontColorInput.value = '#ffffff'; }
        draw();
    };

    let isDragging = false, isPinching = false;
    let startDragOffset = {x:0,y:0}, startPinchDist=0, startCardDims={w:0,h:0,x:0,y:0};

    function getCanvasPoint(evt) {
        const rect = canvas.getBoundingClientRect();
        const cx = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const cy = evt.touches ? evt.touches[0].clientY : evt.clientY;
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
    }
    
    function getDist(evt) {
        if (evt.touches.length < 2) return 0;
        const dx = evt.touches[0].clientX - evt.touches[1].clientX;
        const dy = evt.touches[0].clientY - evt.touches[1].clientY;
        return Math.sqrt(dx*dx + dy*dy);
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 2) {
            isPinching = true; isDragging = false;
            startPinchDist = getDist(e);
            startCardDims = { w: card.width, h: card.height, x: card.x, y: card.y };
            return;
        }
        const pt = getCanvasPoint(e);
        if (pt.x > card.x && pt.x < card.x + card.width && pt.y > card.y && pt.y < card.y + card.height) {
            isDragging = true;
            startDragOffset = { x: pt.x - card.x, y: pt.y - card.y };
        }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (isPinching && e.touches.length === 2) {
            const dist = getDist(e);
            const scale = dist / startPinchDist;
            card.width = Math.max(200, startCardDims.w * scale);
            card.height = Math.max(200, startCardDims.h * scale);
            card.x = startCardDims.x - (card.width - startCardDims.w) / 2;
            card.y = startCardDims.y - (card.height - startCardDims.h) / 2;
            draw();
        } else if (isDragging) {
            const pt = getCanvasPoint(e);
            card.x = pt.x - startDragOffset.x;
            card.y = pt.y - startDragOffset.y;
            draw();
        }
    }, { passive: false });

    canvas.addEventListener('touchend', () => { isDragging = false; isPinching = false; });

    // Spustenie pri naštartovaní
    window.onload = function() {
        initCanvasDimensions();
        draw();
    };
  </script>
 </body>
</html>
