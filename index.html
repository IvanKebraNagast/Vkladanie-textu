<!doctype html>
<html lang="sk" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A4 Text na Obrázok Pro</title>
  
  <!-- ✅ IKONA (IMG_1405.png) - VRÁTENÉ SPÄŤ -->
  <link rel="apple-touch-icon" sizes="180x180" href="./IMG_1405.png">
  <link rel="icon" type="image/png" href="./IMG_1405.png">
  <link rel="shortcut icon" href="./IMG_1405.png">

  <!-- iOS nastavenia -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TextApp">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;700&family=Lora:ital,wght@0,600;1,600&family=Oswald:wght@500&display=swap" rel="stylesheet">
  
  <style>
    body {
      touch-action: manipulation;
      overscroll-behavior: none;
      font-family: 'Inter', sans-serif;
      background-color: #111827;
    }
    
    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 80px; /* Priestor pre panel */
    }
    
    /* Vizuálny efekt pre Canvas - drží pomer A4 */
    canvas {
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      max-width: 95%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px; /* Jemne zaoblené rohy ako papier */
    }
    
    .controls-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 16px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
      z-index: 50;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 75vh;
      overflow-y: auto;
    }

    .controls-panel.collapsed {
        transform: translateY(calc(100% - 60px));
    }

    .toggle-handle {
        width: 50px;
        height: 6px;
        background-color: #e5e7eb;
        border-radius: 10px;
        margin: 0 auto 15px auto;
        cursor: pointer;
    }

    .save-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.98);
        z-index: 100;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    
    .save-modal img {
        max-width: 100%;
        max-height: 70vh;
        border-radius: 8px;
        margin-bottom: 24px;
        box-shadow: 0 0 30px rgba(255,255,255,0.1);
    }

    input[type="color"] {
        -webkit-appearance: none;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid #e5e7eb; border-radius: 50%; }
  </style>
</head>
<body class="h-full flex flex-col">

  <div class="canvas-wrapper flex-1">
      <canvas id="canvas"></canvas>
      <div id="placeholder" class="absolute text-white text-center pointer-events-none p-6 z-10">
          <div class="bg-gray-800/80 backdrop-blur-md p-8 rounded-3xl border border-white/10">
              <svg class="w-16 h-16 mx-auto mb-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              <h2 class="text-xl font-bold mb-1">A4 Automatický Formát</h2>
              <p class="text-gray-400 text-sm">Pridajte text. Aplikácia ho zväčší tak,<br>aby perfektne zaplnil celú stranu.</p>
          </div>
      </div>
  </div>

  <div id="saveModal" class="save-modal">
      <div class="text-center mb-6">
          <h3 class="text-white text-2xl font-bold mb-2">Pripravené!</h3>
          <p class="text-gray-400 text-sm">Podržte prst na obrázku a uložte si ho.</p>
      </div>
      <img id="resultImage" alt="Výsledok">
      <button onclick="closeModal()" class="px-10 py-4 bg-white text-black font-black rounded-full shadow-xl active:scale-95 transition-transform uppercase tracking-wider">Zavrieť</button>
  </div>

  <div class="controls-panel" id="controlsPanel">
      <div class="toggle-handle" id="togglePanel"></div>
      
      <div class="max-w-md mx-auto space-y-5 pb-8">
          <div class="flex gap-3">
              <label class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl text-center font-bold shadow-lg active:scale-95 transition cursor-pointer flex items-center justify-center gap-2">
                  <span>📷</span> Nahrať pozadie
                  <input type="file" id="imageUpload" accept="image/*" class="hidden">
              </label>
              <button id="shareBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition flex items-center justify-center gap-2 text-sm">
                  <span>💾</span> Hotový Obrázok
              </button>
          </div>

          <div class="grid grid-cols-2 gap-3">
              <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                  <h3 class="text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">Podklad pod text</h3>
                  <div class="flex gap-1">
                      <button class="flex-1 py-2 rounded-lg bg-white border border-gray-200 text-xs font-bold shadow-sm" onclick="setTheme('light')">Svetlý</button>
                      <button class="flex-1 py-2 rounded-lg bg-gray-900 text-white text-xs font-bold shadow-sm" onclick="setTheme('dark')">Tmavý</button>
                      <button class="flex-1 py-2 rounded-lg bg-red-100 text-red-600 text-xs font-bold shadow-sm" onclick="setTheme('none')">Bez</button>
                  </div>
              </div>
              <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                  <h3 class="text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">Písmo a Farba</h3>
                  <div class="flex items-center gap-2">
                      <select id="fontFamilySelect" class="flex-1 p-2 text-xs font-bold border-none bg-transparent focus:ring-0 outline-none">
                          <option value="'Inter', sans-serif">Moderné</option>
                          <option value="'Lora', serif">Knižné (Pätkové)</option>
                          <option value="'Oswald', sans-serif">Úzke (Nadpisové)</option>
                          <option value="'Caveat', cursive">Písané rukou</option>
                      </select>
                      <input type="color" id="fontColorInput" value="#1f2937">
                  </div>
              </div>
          </div>

          <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
              <div class="flex justify-between items-center mb-2">
                  <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Priehľadnosť podkladu</h3>
                  <span id="opacityVal" class="text-xs font-bold text-indigo-600">85%</span>
              </div>
              <input type="range" id="opacityInput" min="0" max="100" value="85" class="w-full accent-indigo-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
          </div>

          <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
              <div class="flex justify-between items-center mb-2">
                  <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Váš Text</h3>
                  <span id="autoSizeBadge" class="text-[9px] bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full font-bold">Auto-veľkosť A4</span>
              </div>
              <!-- Odstránili sme obmedzenie na rows="4", pridali flexibilnejšiu výšku -->
              <textarea id="textInput" rows="6" class="w-full p-3 text-sm border-none rounded-xl bg-white shadow-inner resize-none focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Vložte sem celý svoj text (napr. recepty na kolená). Aplikácia ho automaticky zväčší tak, aby vyplnil presne celú A4 stranu..."></textarea>
          </div>
      </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const imageUpload = document.getElementById('imageUpload');
    const shareBtn = document.getElementById('shareBtn');
    const textInput = document.getElementById('textInput');
    const opacityInput = document.getElementById('opacityInput');
    const opacityVal = document.getElementById('opacityVal');
    const fontFamilySelect = document.getElementById('fontFamilySelect');
    const fontColorInput = document.getElementById('fontColorInput');
    const placeholder = document.getElementById('placeholder');
    const controlsPanel = document.getElementById('controlsPanel');
    const togglePanel = document.getElementById('togglePanel');
    const saveModal = document.getElementById('saveModal');
    const resultImage = document.getElementById('resultImage');

    // Predvolený text
    textInput.value = "1. BOLESTI KOLENA\n\nRecept č. 1 – Med a klinčeky: Večer pred spaním potrieť koleno medom a posypať pomletými klinčekmi. Priložiť list lopúcha, obviazať a nechať pôsobiť celú noc. Opakovať 4 noci.\n\nSkúste sem vložiť viac textu. Aplikácia sama vypočíta ideálnu veľkosť písma tak, aby využila celú A4 stranu pre maximálnu čitateľnosť!";

    let img = null;
    let card = {
        opacity: 0.85,
        theme: 'light',
        fontFamily: "'Inter', sans-serif",
        fontColor: "#1f2937"
    };

    // Definovanie fixného A4 rozlíšenia pre Canvas (150 DPI)
    const A4_WIDTH = 1240;
    const A4_HEIGHT = 1754;

    /* Nastavenie Canvasu hneď na začiatku */
    canvas.width = A4_WIDTH;
    canvas.height = A4_HEIGHT;

    function getWrappedLines(context, text, maxWidth) {
        const paragraphs = text.split('\n');
        let allLines = [];
        paragraphs.forEach(p => {
            if (p.trim() === '') {
                allLines.push({ text: '', isEmpty: true });
                return;
            }
            const words = p.split(' ');
            let currentLine = words[0];
            for (let i = 1; i < words.length; i++) {
                const word = words[i];
                const width = context.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    allLines.push({ text: currentLine, isEmpty: false });
                    currentLine = word;
                }
            }
            allLines.push({ text: currentLine, isEmpty: false });
        });
        return allLines;
    }

    function draw() {
        placeholder.style.display = 'none'; // Schováme placeholder hneď ako sa niečo kreslí
        
        // 1. Vykreslenie pozadia (Biela A4 alebo Nahraný obrázok s cover efektom)
        if (img) {
            // Logika "object-fit: cover" pre canvas
            const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
            const x = (canvas.width / 2) - (img.width / 2) * scale;
            const y = (canvas.height / 2) - (img.height / 2) * scale;
            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
        } else {
            // Ak nie je obrázok, dáme čistý biely papier
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Ak nie je žiaden text, končíme tu
        if (textInput.value.trim() === '') return;

        // 2. Vykreslenie podkladu pre text (zaberá celú A4 okrem hlavných okrajov)
        const marginX = 100; // Bočné okraje
        const marginY = 120; // Horné/Dolné okraje
        const contentWidth = canvas.width - (marginX * 2);
        const maxContentHeight = canvas.height - (marginY * 2);

        if (card.theme !== 'none') {
            let bgColor;
            if (card.theme === 'light') bgColor = `rgba(255, 255, 255, ${card.opacity})`;
            else if (card.theme === 'dark') bgColor = `rgba(17, 24, 39, ${card.opacity})`;
            
            ctx.fillStyle = bgColor;
            // Jemné zaoblenie vnútorného podkladu
            ctx.beginPath();
            ctx.roundRect(40, 40, canvas.width - 80, canvas.height - 80, 20);
            ctx.fill();
        }

        // 3. INTELIGENTNÝ VÝPOČET VEĽKOSTI PÍSMA (Binary Search)
        // Hľadáme najväčšie možné písmo, pri ktorom sa text ešte zmestí do maxContentHeight
        let minFont = 14;  // Úplne minimum, aby to nebolo mikroskopické
        let maxFont = 200; // Extrémne veľké pre veľmi krátke texty
        let bestFontSize = minFont;
        let finalLines = [];
        let finalLineHeight = 0;
        let finalTotalHeight = 0;

        // Algoritmus binárneho vyhľadávania (rýchlejšie ako postupne odpočítavať -1)
        while (minFont <= maxFont) {
            let midFont = Math.floor((minFont + maxFont) / 2);
            ctx.font = `${midFont}px ${card.fontFamily}`;
            
            let lines = getWrappedLines(ctx, textInput.value, contentWidth);
            
            let currentLineHeight = midFont * 1.4; // 1.4 riadkovanie
            let paragraphGap = midFont * 0.7;      // Medzera medzi odstavcami
            let totalHeight = 0;
            
            lines.forEach(line => {
                if (line.isEmpty) totalHeight += paragraphGap;
                else totalHeight += currentLineHeight;
            });

            // Ak sa text zmestí do povolenej výšky
            if (totalHeight <= maxContentHeight) {
                bestFontSize = midFont;
                finalLines = lines;
                finalLineHeight = currentLineHeight;
                finalTotalHeight = totalHeight;
                minFont = midFont + 1; // Skúsime, či sa nezmestí ešte väčšie
            } else {
                maxFont = midFont - 1; // Príliš veľké, musíme zmenšiť
            }
        }

        // Ak by sa text nezmestil ani pri minFont, aspoň vykreslíme na minFont
        if (finalLines.length === 0) {
            ctx.font = `${14}px ${card.fontFamily}`;
            finalLines = getWrappedLines(ctx, textInput.value, contentWidth);
            finalLineHeight = 14 * 1.4;
            bestFontSize = 14;
        }

        // 4. Vykreslenie samotného textu
        ctx.fillStyle = (card.theme === 'none' && !img) ? '#000000' : card.fontColor;
        ctx.textBaseline = 'top';
        
        // Ak ide o nadpisový font (Oswald) pridáme tučnosť
        if(card.fontFamily.includes('Oswald') || card.fontFamily.includes('Inter')) {
            ctx.font = `600 ${bestFontSize}px ${card.fontFamily}`;
        } else {
            ctx.font = `${bestFontSize}px ${card.fontFamily}`;
        }

        // Aplikujeme tieň len ak nie je podklad a je tam obrázok
        if (card.theme === 'none' && img) {
            ctx.shadowColor = card.fontColor === '#ffffff' || card.fontColor === '#fff' ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.8)';
            ctx.shadowBlur = bestFontSize / 3;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
        } else {
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        // Centrovanie celého bloku textu vertikálne na A4 stránke
        // (ak je textu málo, bude pekne v strede, ak veľa, vyplní to odhora dole)
        let startY = (canvas.height - finalTotalHeight) / 2;
        
        // Ak je text extrémne dlhý a padol by mimo, ukotvíme ho hore
        if (startY < marginY) startY = marginY;

        let currentY = startY;

        finalLines.forEach(line => {
            if (line.isEmpty) {
                currentY += bestFontSize * 0.7;
            } else {
                ctx.fillText(line.text, marginX, currentY);
                currentY += finalLineHeight;
            }
        });
        
        ctx.shadowBlur = 0; // Reset
    }

    shareBtn.addEventListener('click', () => {
        draw();
        resultImage.src = canvas.toDataURL("image/png", 1.0); // 1.0 = Max kvalita
        saveModal.style.display = 'flex';
    });

    window.closeModal = () => { saveModal.style.display = 'none'; }

    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            img = new Image();
            img.onload = () => {
                draw(); // Už neriešime šírku/výšku card, text vyplní celú A4
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    });

    opacityInput.addEventListener('input', (e) => { 
        card.opacity = e.target.value / 100; 
        opacityVal.innerText = e.target.value + '%';
        draw(); 
    });
    fontFamilySelect.addEventListener('change', (e) => { card.fontFamily = e.target.value; draw(); });
    fontColorInput.addEventListener('input', (e) => { card.fontColor = e.target.value; draw(); });
    textInput.addEventListener('input', draw);
    togglePanel.addEventListener('click', () => { controlsPanel.classList.toggle('collapsed'); });

    window.setTheme = (theme) => {
        card.theme = theme;
        if (theme === 'light') { card.fontColor = '#1f2937'; fontColorInput.value = '#1f2937'; }
        else if (theme === 'dark') { card.fontColor = '#ffffff'; fontColorInput.value = '#ffffff'; }
        else if (theme === 'none') { card.fontColor = '#1f2937'; fontColorInput.value = '#1f2937'; }
        draw();
    };

    // Počiatočné vykreslenie
    window.addEventListener('load', () => {
        // Skryť modal na začiatku
        saveModal.style.display = 'none';
        // Vykresliť prázdny biely papier s textom
        draw();
    });

  </script>
</body>
</html>
